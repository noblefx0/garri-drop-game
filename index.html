<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GARRI DROP</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #9ee914;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    .game-wrap {
      width: min(100%, 520px);
    }

    .top {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: stretch;
    }

    .sound-toggle {
      flex: 0 0 52px;
      border: 2px solid #111;
      border-radius: 14px;
      background: #fff;
      color: #111;
      padding: 0;
      font-size: 21px;
      line-height: 1;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sound-toggle:active { transform: scale(.96); }

    .stat {
      flex: 1;
      background: #fff;
      border: 2px solid #111;
      border-radius: 14px;
      padding: 9px 8px;
      text-align: center;
    }

    .label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #666;
      text-transform: uppercase;
    }

    .value {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 2px;
    }

    .arena {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 9 / 14;
      min-height: 440px;
      max-height: 650px;
      background: #9ee914;
      border: 3px solid #111;
      border-radius: 22px;
      touch-action: manipulation;
      user-select: none;
    }

    .item {
      position: absolute;
      top: -70px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      font-size: 35px;
      cursor: pointer;
      z-index: 3;
      filter: drop-shadow(0 4px 2px rgba(0,0,0,.2));
      will-change: transform;
      transition: transform .08s;
      overflow: hidden;
    }

    .item.garri {
      background: #fff;
      border: 3px solid #111;
    }

    .item.bad {
      background: #ffd8d4;
      border: 3px solid #b84c40;
    }

    .item.garri img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .title {
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .sub {
      font-size: 13px;
      color: #555;
      margin-top: 3px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(4px);
    }

    .panel {
      width: min(100%, 330px);
      text-align: center;
      background: #fff;
      border: 2px solid #111;
      border-radius: 22px;
      padding: 26px 20px;
    }

    button {
      border: 0;
      border-radius: 14px;
      background: #111;
      color: #fff;
      font-weight: 900;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      min-height: 48px;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #0b7a3b; outline-offset: 3px; }

    .hidden { display: none !important; }
    .hearts { letter-spacing: 2px; }

    .game-over-splash {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(255, 0, 0, .10);
    }

    .game-over-splash .game-over-text {
      color: #e00000;
      font-size: clamp(42px, 12vw, 76px);
      font-weight: 1000;
      letter-spacing: -.06em;
      text-shadow: 0 4px 0 #111, 0 0 22px rgba(255,255,255,.7);
      transform: scale(1.55);
      filter: blur(12px);
      opacity: 0;
      animation: gameOverIn .8s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .new-high {
      color: #e00000;
      font-weight: 1000;
      font-size: 16px;
      margin-top: -8px;
      margin-bottom: 12px;
      animation: pulseHigh .8s ease-in-out infinite alternate;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
      transform: none !important;
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: rgba(217, 40, 40, .25);
      opacity: 0;
    }

    .flash.on { animation: hit .22s ease-out; }

    .float {
      position: absolute;
      z-index: 7;
      font-weight: 1000;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp .55s ease-out forwards;
    }

    @keyframes hit {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-45px) scale(1.15); }
    }

    @keyframes gameOverIn {
      0% { opacity: 0; transform: scale(1.7); filter: blur(14px); }
      55% { opacity: 1; transform: scale(.92); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes pulseHigh {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    @media (max-width: 400px) {
      body { padding: 10px 8px; }
      .arena { min-height: 430px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .float, .flash.on { animation: none; opacity: 0; }
    }
  </style>
</head>

<body>
  <main class="game-wrap">
    <div class="top">
      <div class="stat">
  <div class="label">Score</div>
  <div class="value" id="score">0</div>
</div>

<div class="stat">
  <div class="labsel">High Score</div>
  <div class="value" id="highScore">0</div>
</div>

      <div class="stat">
        <div class="label">Time</div>
        <div class="value" id="time">30</div>
      </div>

      <div class="stat">
        <div class="label">Lives</div>
        <div class="value hearts" id="lives">❤️❤️❤️❤️❤️</div>
      </div>

      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>

    <div class="arena" id="arena" aria-label="GARRI falling game">
      <div class="flash" id="flash"></div>

      <div class="overlay" id="startOverlay">
        <div class="panel">
          <div class="title">🥣 GARRI DROP</div>
          <div class="sub" style="margin:8px 0 20px">
            tap the GARRI. don't tap the bombs.
          </div>
          <button id="startBtn" type="button">START GAME</button>
        </div>
      </div>

      <div class="game-over-splash hidden" id="gameOverSplash" aria-hidden="true">
        <div class="game-over-text">GAME OVER</div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="panel">
          <div class="title">GAME OVER</div>
          <div class="sub" id="endReason" style="margin-top:6px">time's up</div>

          <div style="font-size:46px;font-weight:1000;margin:12px 0 10px" id="finalScore">
            0
          </div>

          <div class="new-high hidden" id="newHigh">NEW HIGH SCORE!</div>

          <div class="sub" style="margin-bottom:18px">GARRI CAUGHT</div>

          <button id="restartBtn" type="button" disabled>PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin-top:10px;font-size:12px;color:#fff">
      tap GARRI · avoid 💣 · catch as much GARRI as possible
    </div>
  </main>

  <script>
    /*
      ============================
      EASY SETTINGS
      ============================

      1. Put your real Garri meme image inside:
         assets/garri.png

      2. Keep this setting as:
         GARRI_IMAGE: "assets/garri.png"

      3. If you want to use another filename, change it here.

      You can also change:
      - GAME_TIME
      - STARTING_LIVES
      - GAME_BACKGROUND

      Sound, mute, high score and game-over effects are handled automatically below.
    */

    const CONFIG = {
      GARRI_IMAGE: "assets/garri.png",

      GAME_TIME: 30,
      STARTING_LIVES: 5,

      // Change this to any CSS color you want.
      GAME_BACKGROUND: "#9ee914"
    };

    const arena = document.getElementById("arena");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const timeEl = document.getElementById("time");
    const livesEl = document.getElementById("lives");

    const startOverlay = document.getElementById("startOverlay");
    const endOverlay = document.getElementById("endOverlay");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const soundToggle = document.getElementById("soundToggle");

    const finalScore = document.getElementById("finalScore");
    const endReason = document.getElementById("endReason");
    const newHigh = document.getElementById("newHigh");
    const gameOverSplash = document.getElementById("gameOverSplash");
    const flash = document.getElementById("flash");

    arena.style.background = CONFIG.GAME_BACKGROUND;

    let score = 0;
    let lives = CONFIG.STARTING_LIVES;
    let timeLeft = CONFIG.GAME_TIME;
    let running = false;

    let lastTime = 0;
    let spawnTimer = 0;
    let animationFrame = 0;
    let gameTimer = 0;
    let ending = false;

    const HIGH_SCORE_KEY = "garri-drop-high-score";
    const MUTE_KEY = "garri-drop-muted";
    let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY) || 0);
    highScoreEl.textContent = String(highScore);
    let muted = localStorage.getItem(MUTE_KEY) === "1";
    let audioContext = null;

    const items = new Set();

    function updateSoundButton() {
      soundToggle.textContent = muted ? "🔇" : "🔊";
      soundToggle.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
      soundToggle.title = muted ? "Unmute sound" : "Mute sound";
    }

    function getAudioContext() {
      if (muted) return null;

      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        audioContext = new AudioCtx();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }

      return audioContext;
    }

    function playSound(type) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === "catch") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + .09);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.16, now + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .12);
        osc.start(now);
        osc.stop(now + .13);
      } else if (type === "bad") {
        osc.type = "square";
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + .16);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.12, now + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .18);
        osc.start(now);
        osc.stop(now + .19);
      } else if (type === "miss") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + .24);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.10, now + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .25);
        osc.start(now);
        osc.stop(now + .26);
      } else if (type === "gameover") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + .65);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.16, now + .03);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .7);
        osc.start(now);
        osc.stop(now + .72);
      }
    }

    updateSoundButton();

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function resetGame() {
      items.forEach(item => item.el.remove());
      items.clear();

      score = 0;
      lives = CONFIG.STARTING_LIVES;
      timeLeft = CONFIG.GAME_TIME;

      scoreEl.textContent = "0";
      timeEl.textContent = String(timeLeft);
      updateLives();
      newHigh.classList.add("hidden");
      restartBtn.disabled = true;
      gameOverSplash.classList.add("hidden");
      ending = false;
    }

    function updateLives() {
      livesEl.textContent =
        "❤️".repeat(Math.max(0, lives)) || "💀";
    }

    function startGame() {
      getAudioContext();
      resetGame();

      running = true;
      startOverlay.classList.add("hidden");
      endOverlay.classList.add("hidden");

      lastTime = performance.now();
      spawnTimer = 0;

      gameTimer = window.setInterval(() => {
        if (!running) return;

        timeLeft--;
        timeEl.textContent = String(timeLeft);

        if (timeLeft <= 0) {
          endGame("time");
        }
      }, 1000);

      animationFrame = requestAnimationFrame(gameLoop);
    }

    function endGame(reason) {
      if (!running || ending) return;

      running = false;
      ending = true;

      clearInterval(gameTimer);
      cancelAnimationFrame(animationFrame);

      items.forEach(item => item.el.remove());
      items.clear();

      finalScore.textContent = String(score);

      if (reason === "lives") {
        endReason.textContent = "you missed too much GARRI 😭";
      } else {
        endReason.textContent = "time's up";
      }

      const isNewHigh = score > highScore;
      if (isNewHigh) {
        highScore = score;
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
        highScoreEl.textContent = String(highScore);
      }

      newHigh.classList.toggle("hidden", !isNewHigh);
      endOverlay.classList.add("hidden");
      gameOverSplash.classList.remove("hidden");
      void gameOverSplash.offsetWidth;

      playSound("gameover");

      // Keep the final screen locked briefly so a rapid last tap cannot
      // accidentally hit PLAY AGAIN.
      window.setTimeout(() => {
        if (!ending) return;
        gameOverSplash.classList.add("hidden");
        endOverlay.classList.remove("hidden");

        window.setTimeout(() => {
          if (!ending) return;
          restartBtn.disabled = false;
        }, 450);
      }, 950);
    }

    function loseLife(x, y) {
      lives--;
      updateLives();

      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");

      popText(x, y, "MISS!", "bad");
      playSound("miss");

      if (lives <= 0) {
        endGame("lives");
      }
    }

    function popText(x, y, text, type) {
      const p = document.createElement("div");

      p.className = "float";
      p.textContent = text;
      p.style.left = x + "px";
      p.style.top = y + "px";

      if (type === "bad") {
        p.style.color = "#b52f2f";
      } else {
        p.style.color = "#fff";
        p.style.textShadow = "0 2px 4px #000";
      }

      arena.appendChild(p);

      setTimeout(() => p.remove(), 600);
    }

    function createGarriImage() {
      const img = document.createElement("img");

      img.src = CONFIG.GARRI_IMAGE;
      img.alt = "GARRI";

      // If the image isn't there yet, use the emoji instead.
      img.addEventListener("error", () => {
        img.remove();
      }, { once: true });

      return img;
    }

    function spawnItem() {
      const el = document.createElement("div");

      const isGarri = Math.random() < 0.67;

      el.className = "item " + (isGarri ? "garri" : "bad");

      if (isGarri) {
        const img = createGarriImage();
        el.appendChild(img);
      } else {
        el.textContent = Math.random() < 0.55 ? "💣" : "🪨";
      }

      const rect = arena.getBoundingClientRect();
      const size = 62;

      const x = random(
        4,
        Math.max(5, rect.width - size - 4)
      );

      el.style.left = x + "px";
      el.style.transform =
        "rotate(" + random(-25, 25) + "deg)";

      arena.appendChild(el);

      const speed =
        random(150, 230) +
        (CONFIG.GAME_TIME - timeLeft) * 4;

      const obj = {
        el,
        x,
        y: -70,
        speed,
        isGarri,
        angle: random(-60, 60),
        spin: random(-90, 90)
      };

      items.add(obj);

      el.addEventListener("pointerdown", event => {
        if (!running || !items.has(obj)) return;

        event.preventDefault();

        const arenaRect = arena.getBoundingClientRect();

        const px = event.clientX - arenaRect.left;
        const py = event.clientY - arenaRect.top;

        if (obj.isGarri) {
          score++;
          scoreEl.textContent = String(score);

          popText(
            px - 10,
            py - 15,
            "+1 GARRI",
            "good"
          );
          playSound("catch");

          obj.el.remove();
          items.delete(obj);
        } else {
          obj.el.remove();
          items.delete(obj);

          playSound("bad");
          loseLife(px, py);
        }
      });
    }

    function gameLoop(now) {
      if (!running) return;

      const delta =
        Math.min(0.035, (now - lastTime) / 1000);

      lastTime = now;
      spawnTimer += delta;

      // Gets faster as the game continues.
      const interval = Math.max(
        0.22,
        0.72 -
          (CONFIG.GAME_TIME - timeLeft) * 0.018
      );

      if (spawnTimer >= interval) {
        spawnTimer = 0;

        spawnItem();

        if (timeLeft < 18 && Math.random() < 0.35) {
          spawnItem();
        }

        if (timeLeft < 8 && Math.random() < 0.45) {
          spawnItem();
        }
      }

      const arenaHeight = arena.clientHeight;

      for (const obj of [...items]) {
        obj.y += obj.speed * delta;
        obj.angle += obj.spin * delta;

        obj.el.style.transform =
          "translateY(" +
          obj.y +
          "px) rotate(" +
          obj.angle +
          "deg)";

        if (obj.y > arenaHeight + 30) {
          obj.el.remove();
          items.delete(obj);

          // Missing GARRI costs a life.
          if (obj.isGarri) {
            loseLife(obj.x, arenaHeight - 40);
          }
        }
      }

      animationFrame = requestAnimationFrame(gameLoop);
    }

    soundToggle.addEventListener("click", () => {
      muted = !muted;
      localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
      updateSoundButton();

      if (!muted) {
        getAudioContext();
        playSound("catch");
      }
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", () => {
      if (restartBtn.disabled) return;
      startGame();
    });
  </script>
</body>
</html>
